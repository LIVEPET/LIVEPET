# ==============================================================================
# LIVEPET - Render Blueprint Specification (render.yaml)
# Serviços: Back-end (FastAPI Web Service) e Front-end (React/Vite Static Site)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Back-end API (Python / FastAPI)
  # ----------------------------------------------------------------------------
  - type: web
    name: livepet-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon

    envVars:
      - key: DATABASE_URL
        sync: false          # Configurado com o PostgreSQL do Neon

      - key: SECRET_KEY
        generateValue: true  # O Render gera uma chave segura automaticamente

      - key: ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440

      - key: PROJECT_NAME
        value: LivePet API

      - key: VERSION
        value: 1.0.0

      - key: API_V1_STR
        value: /api/v1

      # CORS: permite qualquer origem (ideal para comunicação com o frontend)
      - key: BACKEND_CORS_ORIGINS
        value: "*"

  # ----------------------------------------------------------------------------
  # 2. Front-end Web (React / Vite)
  # ----------------------------------------------------------------------------
  - type: static
    name: livepet-web
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      # Regra essencial para Single Page Applications (SPA):
      # Evita erro 404 ao recarregar rotas no navegador (ex: /pets, /matchpet)
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_SUPABASE_PROJECT_ID
        value: "tziwagmcnpneenjywcnc"

      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        value: "sb_publishable_M9hKM5pH-3ZMfUp5333B4w_wt7lkv4r"

      - key: VITE_SUPABASE_URL
        value: "https://tziwagmcnpneenjywcnc.supabase.co"
