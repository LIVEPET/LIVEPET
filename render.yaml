# ==============================================================================
# LIVEPET - Render Blueprint Specification (render.yaml)
# Serviços: Back-end (FastAPI Web Service) e Front-end (React/Vite Static Site)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Back-end API (Python / FastAPI)
  # ----------------------------------------------------------------------------
  - type: web
    name: livepet-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon

    envVars:
      - key: DATABASE_URL
        sync: false          # Configurado com o PostgreSQL do Neon

      - key: SECRET_KEY
        generateValue: true  # O Render gera uma chave segura automaticamente

      - key: ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440

      - key: PROJECT_NAME
        value: LivePet API

      - key: VERSION
        value: 1.0.0

      - key: API_V1_STR
        value: /api/v1

      - key: ENVIRONMENT
        value: production

      # CORS: restringe exclusivamente às origens oficiais do frontend (LivePet Web e preview) e desenvolvimento local
      - key: BACKEND_CORS_ORIGINS
        value: "https://livepet-1.onrender.com,https://livepet-web.onrender.com,https://livepet.onrender.com,http://localhost:5173,http://127.0.0.1:5173"

  # ----------------------------------------------------------------------------
  # 2. Front-end Web (React / Vite)
  # ----------------------------------------------------------------------------
  - type: static
    name: livepet-web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      # Regra essencial para Single Page Applications (SPA):
      # Evita erro 404 ao recarregar rotas no navegador (ex: /pets, /matchpet)
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      # URL da API Back-end FastAPI no Render
      - key: VITE_API_URL
        value: "https://livepet.onrender.com"
